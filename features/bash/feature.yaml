spec_version: 1
description: Bash shell configuration with custom settings
depends: []

resources:

  - kind: fs
    id: fs:bashrc
    source: files/.bashrc
    path: ~/.bashrc
    entry_type: file
    op: link

  - kind: fs
    id: fs:bashrc.d
    source: files/.bashrc.d
    path: ~/.bashrc.d
    entry_type: dir
    op: link
