spec_version: 1
description: Git enhancement tools (lazygit, delta)
depends:
  - git

requires:
  - name: package_manager

resources:

  - kind: package
    id: pkg:lazygit
    name: lazygit

  - kind: package
    id: pkg:git-delta
    name: git-delta

  - kind: fs
    id: fs:lazygit-config
    source: files/lazygit
    path: ~/.config/lazygit
    entry_type: dir
    op: link
