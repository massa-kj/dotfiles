spec_version: 1
description: Neovim text editor with custom configuration
depends:
  - git

requires:
  - name: package_manager

resources:

  - kind: package
    id: pkg:neovim
    name: neovim

  - kind: fs
    id: fs:nvim-config
    source: files/nvim
    path: ~/.config/nvim
    entry_type: dir
    op: link
