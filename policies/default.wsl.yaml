policy: "default.wsl"

package:
  # WSL uses Homebrew for package management (same as Linux).
  default_backend: brew
  # Per-resource backend overrides, keyed by the exact package name.
  overrides:
    typescript:
      backend: npm
    typescript-language-server:
      backend: npm
    eslint:
      backend: npm
    python-lsp-server:
      backend: uv

runtime:
  # Default backend for runtime installs (node, python, rust, lua, etc.).
  default_backend: mise
  # Per-resource backend overrides, keyed by the runtime name
  # (e.g. "node", "python") — not the feature name.
  # Example:
  #   overrides:
  #     node:
  #       backend: mise
  overrides: {}

fs:
  backup: true
  backup_dir: "~/.dotfiles_backup"
